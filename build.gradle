plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

group = mod_group
version = mod_version

base {
    archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    mavenCentral()
    maven {
        name = 'RYS family'
        url = rootProject.file('../RYSCore/repo')
        content { includeGroup 'works.repka.ryscore' }
    }
}

// Автотест живёт только в запусках для разработки и в jar не попадает.
sourceSets {
    autotest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

neoForge {
    version = neo_version

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.autotest
        }
    }

    runs {
        client {
            client()
            gameDirectory = project.file('run')
        }
        // Выделенный сервер: серверная сторона не тянет клиентские классы.
        dedicated {
            type = 'gameTestServer'
            gameDirectory = project.file('run-server')
        }
        // Сервер и два клиента: сценарий DuoTest (жалоба, правила при входе, заморозка). Запуск tools/duo.sh
        duoServer {
            server()
            gameDirectory = project.file('run-duo/server')
            programArguments.add '--nogui'
            jvmArguments.add '-Xmx3G'
        }
        duoAlpha {
            client()
            gameDirectory = project.file('run-duo/alpha')
            systemProperty 'ryshelm.duo', 'alpha'
            jvmArguments.add '-Xmx3G'
            programArguments.addAll '--username', 'Alpha', '--width', '1280', '--height', '800'
        }
        duoBeta {
            client()
            gameDirectory = project.file('run-duo/beta')
            systemProperty 'ryshelm.duo', 'beta'
            jvmArguments.add '-Xmx3G'
            programArguments.addAll '--username', 'Beta', '--width', '1280', '--height', '800'
        }
        autotest {
            client()
            gameDirectory = project.file('run')
            systemProperty 'ryshelm.autotest', project.findProperty('autotest') ?: 'ui'
            jvmArguments.add "-Xmx${project.findProperty('heap') ?: '4G'}"
            systemProperty 'ryshelm.autotest.fixtures', project.findProperty('fixtures') ?: project.file('../../_shared/_saved/fixtures/ftb-2026-11-18').absolutePath
            programArguments.addAll '--width', '1280', '--height', '800'
        }
    }

    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

neoForge.addModdingDependenciesTo(sourceSets.autotest)

dependencies {
    implementation "works.repka.ryscore:ryscore-neoforge:${ryscore_version}"
    autotestImplementation "works.repka.ryscore:ryscore-neoforge:${ryscore_version}"
    jarJar("works.repka.ryscore:ryscore-neoforge:[${ryscore_version},2.0.0)") {
        version { prefer ryscore_version }
        transitive = false
    }

    testImplementation "org.junit.jupiter:junit-jupiter:${junit_version}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

test {
    useJUnitPlatform()
    // Копия файлов FTB сервера RepYS (18.11): проверка шага admin без неё пропускается.
    systemProperty 'ryshelm.fixtures', project.findProperty('fixtures') ?: project.file('../../_shared/_saved/fixtures/ftb-2026-11-18').absolutePath
}

processResources {
    def props = [
        mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
        mod_authors: mod_authors, mod_license: mod_license,
        minecraft_version_range: minecraft_version_range,
        neo_version_range: neo_version_range,
        ryscore_version: ryscore_version
    ]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') {
        expand props
    }
}
